<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FamilyFund Premium</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Cliente de Socket.IO -->
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <div class="container">
    <h1>FamilyFund</h1>

    <!-- Auth -->
    <div class="auth-container" id="authContainer">
      <h2>Acceso familiar</h2>
      <div class="auth-tabs">
        <button id="tabLogin" class="active">Iniciar sesión</button>
        <button id="tabRegister">Registrarse</button>
      </div>

      <div id="loginForm" class="auth-form">
        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPassword" placeholder="Contraseña">
        <button id="btnLogin">Entrar</button>
        <p id="loginError" class="error-text"></p>
      </div>

      <div id="registerForm" class="auth-form hidden">
        <input type="text" id="registerFamily" placeholder="Nombre de la familia">
        <input type="email" id="registerEmail" placeholder="Email">
        <input type="password" id="registerPassword" placeholder="Contraseña">
        <button id="btnRegister">Crear cuenta</button>
        <p id="registerError" class="error-text"></p>
      </div>
    </div>

    <!-- App -->
    <div id="appContainer" class="hidden">
      <p id="familyLabel" class="family-label"></p>
      <button id="btnLogout" class="logout-btn">Cerrar sesión</button>

      <div class="tank-container">
        <div class="tank-glass">
          <div id="tank-water"></div>
          <div class="tank-shine"></div>
        </div>
      </div>

      <div class="info">
        <p id="saldoText">Saldo actual: € 0</p>
        <p id="capacidadText">Capacidad máxima: —</p>
        <p id="ahorroText">Ahorro: 0% del total ingresado</p>
        <p id="totalesText">Ingresos año: € 0 — Gastos año: € 0</p>
        <button id="btnAjustes">⚙ Ajustar capacidad</button>
      </div>

      <form id="movementForm">
        <input type="text" id="description" placeholder="Descripción" required>
        <input type="number" id="amount" step="0.01" placeholder="Monto (€)" required>
        <div class="buttons-row">
          <button type="button" id="btnIngreso" class="btn-income">+ Ingreso</button>
          <button type="button" id="btnGasto" class="btn-expense">- Gasto</button>
        </div>
      </form>

      <ul id="movementList"></ul>

      <div class="chart-container">
        <h2>Resumen anual</h2>
        <canvas id="yearChart"></canvas>
      </div>

      <div class="savings-container">
        <h2>Ahorro general</h2>
        <p id="savingsSummary">Ahorro total: € 0 (0% del total ingresado)</p>
        <div class="savings-row">
          <div class="savings-field">
            <label for="savingsPercentInput">% automático de ahorro</label>
            <input type="number" id="savingsPercentInput" step="0.1" min="0" placeholder="Ej: 10">
          </div>
          <div class="savings-field">
            <label for="savingsManualInput">Ahorro manual (€)</label>
            <input type="number" id="savingsManualInput" step="0.01" min="0" placeholder="Ej: 500">
          </div>
        </div>
        <button id="saveSavings">Actualizar ahorro</button>
      </div>

      <div class="savings-boxes">
        <h2>Cajas de ahorro</h2>

        <div class="box-form">
          <input type="text" id="boxName" placeholder="Nombre (ej: Vacaciones)">
          <input type="number" id="boxPercent" step="0.1" min="0" placeholder="% automático">
          <input type="number" id="boxManual" step="0.01" min="0" placeholder="Ahorro manual (€)">
          <button type="button" id="addBox">Agregar caja</button>
        </div>

        <ul id="boxesList"></ul>
      </div>
    </div>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <h2>Configurar capacidad máxima</h2>
      <input type="number" id="maxInput" placeholder="Ej: 3000">
      <button id="saveMax">Guardar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
